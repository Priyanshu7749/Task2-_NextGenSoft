<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Login Page</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, sans-serif;
        }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          background: linear-gradient(135deg, #6e8efb, #a777e3);
        }

        .login-container {
          background: white;
          width: 100%;
          max-width: 400px;
          padding: 30px;
          border-radius: 12px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
          text-align: center;
        }

        .login-container h2 {
          color: #4a4a4a;
          margin-bottom: 20px;
        }

        .input-field {
          width: 100%;
          padding: 12px;
          margin: 10px 0;
          border: 1px solid #ccc;
          border-radius: 8px;
          font-size: 16px;
        }

        .btn {
          width: 100%;
          padding: 12px;
          border: none;
          border-radius: 8px;
          background: #6e8efb;
          color: white;
          font-size: 16px;
          cursor: pointer;
          transition: background 0.3s;
        }

        .btn:hover {
          background: #a777e3;
        }

        .bottom-text {
          margin-top: 20px;
          font-size: 14px;
          color: #6e6e6e;
        }

        .bottom-text a {
          color: #6e8efb;
          text-decoration: none;
        }

        .bottom-text a:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Login</h2>
    <form action="login" method="post">
        <input
                type="email"
                name="email"
                class="input-field"
                placeholder="Enter your Email"
                required
        />
        <input
                type="password"
                name="password"
                class="input-field"
                placeholder="Enter your password"
                required
        />
        <button type="submit" class="btn">Login</button>
    </form>

</div>
</body>
</html>
